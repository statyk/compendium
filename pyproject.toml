[project]
name = "compendium-ils"
dynamic = ["version"]
description = "A library card catalog system for physical items"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Shawn", email = "spmoore01@gmail.com" },
]
keywords = ["library", "catalog", "ils", "circulation", "books", "marc", "opac", "lms"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Intended Audience :: Other Audience",
    "Topic :: Other/Nonlisted Topic",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]

dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pymarc>=5.2",
    "reportlab>=4.0",
    "python-barcode>=0.16.1",
    "cryptography>=42.0",
    "defusedxml>=0.7.1",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/statyk/compendium"
Repository = "https://github.com/statyk/compendium"
Issues = "https://github.com/statyk/compendium/issues"
Documentation = "https://github.com/statyk/compendium/blob/master/README.md"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.8",
]
e2e = [
    "pytest-playwright>=0.5",
]

[project.scripts]
compendium = "compendium.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/compendium/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/compendium"]

[tool.hatch.build.targets.wheel.force-include]
"docker" = "compendium/_scaffold"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "C4",           # comprehensions
]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends() in function defaults by design — B008 is a false positive.
"src/compendium/api/**" = ["B008"]
"src/compendium/web/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not e2e and not visual'"
markers = [
    "e2e: browser end-to-end tests (require `uv sync --extra e2e && playwright install chromium`)",
    "visual: label matrix render + visual review (require `uv sync --extra e2e && playwright install chromium`; run with `uv run pytest -m visual`)",
]

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

