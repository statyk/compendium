[project]
name = "compendium"
version = "0.1.0"
description = "A library card catalog system for physical items"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Shawn", email = "spmoore01@gmail.com" },
]
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pymarc>=5.2",
    "reportlab>=4.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.8",
]
e2e = [
    "pytest-playwright>=0.5",
]

[project.scripts]
compendium = "compendium.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compendium"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "C4",           # comprehensions
]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends() in function defaults by design — B008 is a false positive.
"src/compendium/api/**" = ["B008"]
"src/compendium/web/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: browser end-to-end tests (require `uv sync --extra e2e && playwright install chromium`)",
]

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.8",
]

