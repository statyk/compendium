{% extends "base.html" %}
{% block title %}New Policy — {{ library_name() }}{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
  <ul>
    <li><a href="/ui/policies">Loan Policies</a></li>
    <li>New Policy</li>
  </ul>
</nav>

<h2>Create Loan Policy</h2>

{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}

<form method="post" action="/ui/policies/new">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" required autofocus autocomplete="off">
  <label for="media_type_id">Applies to media <span class="field-hint" data-tooltip="Leave blank to match all media types.">ⓘ</span></label>
  <select id="media_type_id" name="media_type_id">
    <option value="">All media</option>
    {% for mt in media_types %}
    <option value="{{ mt.id }}">{{ mt.display_name }}</option>
    {% endfor %}
  </select>
  <label for="patron_category_id">Applies to patron category <span class="field-hint" data-tooltip="Leave blank to match all patron categories. Specificity order: media+category wins over media-only, category-only, or default.">ⓘ</span></label>
  <select id="patron_category_id" name="patron_category_id">
    <option value="">All patrons</option>
    {% for c in categories %}
    <option value="{{ c.id }}">{{ c.display_name }}</option>
    {% endfor %}
  </select>
  <label for="loan_period_days">Loan period (days)</label>
  <input type="number" id="loan_period_days" name="loan_period_days" min="1" value="14" required>
  <label for="max_renewals">Maximum renewals</label>
  <input type="number" id="max_renewals" name="max_renewals" min="0" value="2" required>
  <label>
    <input type="checkbox" name="is_default" value="on">
    Set as default policy (replaces current default)
  </label>
  <div style="margin-top:1rem; display:flex; gap:0.5rem">
    <button type="submit">Create Policy</button>
    <a href="/ui/policies" role="button" class="outline secondary">Cancel</a>
  </div>
</form>
{% endblock %}
