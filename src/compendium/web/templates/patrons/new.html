{% extends "base.html" %}
{% block title %}New Patron — {{ library_name() }}{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
  <ul>
    <li><a href="/ui/patrons">Patrons</a></li>
    <li>New Patron</li>
  </ul>
</nav>

<h2>Add Patron</h2>

{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}

<form method="post" action="/ui/patrons/new">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="full_name">Full name</label>
  <input type="text" id="full_name" name="full_name" required autofocus>
  <label for="contact_email">Email</label>
  <input type="email" id="contact_email" name="contact_email">
  <label for="contact_phone">Phone</label>
  <input type="tel" id="contact_phone" name="contact_phone">
  <label for="user_id">Link user account <span class="field-hint" data-tooltip="Linking lets this patron sign in to the web UI to view their own loans, holds, and fines.">ⓘ</span></label>
  <select id="user_id" name="user_id">
    <option value="">— none —</option>
    {% for u in unlinked_users %}
    <option value="{{ u.id }}">{{ u.username }}{% if u.email %} ({{ u.email }}){% endif %} — {{ u.role.name }}</option>
    {% endfor %}
  </select>
  <label for="category_id">Category <span class="field-hint" data-tooltip="Patron category determines which loan policies apply. Leave blank for the default policy.">ⓘ</span></label>
  <select id="category_id" name="category_id">
    <option value="">— none —</option>
    {% for c in categories %}
    <option value="{{ c.id }}"{% if c.is_default %} selected{% endif %}>{{ c.display_name }}</option>
    {% endfor %}
  </select>
  <label for="expires_at">Card expires</label>
  <input type="date" id="expires_at" name="expires_at">
  <p class="form-help">A library card number will be assigned automatically.</p>
  <div style="margin-top:1rem; display:flex; gap:0.5rem">
    <button type="submit">Add Patron</button>
    <a href="/ui/patrons" role="button" class="outline secondary">Cancel</a>
  </div>
</form>
{% endblock %}
