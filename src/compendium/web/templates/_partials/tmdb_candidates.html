<p><strong>{{ candidates|length }} result(s) for &ldquo;{{ query }}&rdquo;</strong> &mdash; select a film to continue.</p>
<div style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem">
{% for c in candidates %}
  <form hx-post="/ui/items/lookup" hx-target="#item-preview" hx-swap="innerHTML" style="margin:0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="media_type" value="{{ media_type }}">
    <input type="hidden" name="identifier" value="{{ c.tmdb_id }}">
    <button type="submit" class="outline secondary" style="text-align:left; width:100%; padding:0.5rem 0.75rem; display:flex; gap:0.75rem; align-items:flex-start">
      {% if c.poster_url %}
      <img src="{{ c.poster_url }}" alt="" style="width:45px; flex-shrink:0; border-radius:2px">
      {% else %}
      <div style="width:45px; flex-shrink:0; background:var(--pico-muted-border-color); border-radius:2px; aspect-ratio:2/3"></div>
      {% endif %}
      <div style="min-width:0">
        <strong>{{ c.title }}</strong>{% if c.year %} <small>({{ c.year }})</small>{% endif %}
        {% if c.overview %}<br><small style="color:var(--pico-muted-color)">{{ c.overview }}</small>{% endif %}
      </div>
    </button>
  </form>
{% endfor %}
</div>
