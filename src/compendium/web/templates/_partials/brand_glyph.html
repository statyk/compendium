{% macro brand_glyph(size='4rem', extra_class='', label=None) %}
<svg class="brand-glyph{{ ' ' + extra_class if extra_class }}" viewBox="0 0 24 24"
     style="width:{{ size }};height:{{ size }}"
     {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %}>
  <rect x="3" y="5" width="18" height="14" rx="1.5"
        fill="var(--cmp-glyph-body)" stroke="var(--cmp-glyph-stroke)" stroke-width="0.7"/>
  <rect x="8.5" y="8" width="7" height="2" rx="0.5"
        fill="var(--cmp-glyph-label)"/>
  <circle cx="12" cy="15" r="1.4"
        fill="var(--cmp-glyph-pull)"/>
</svg>
{% endmacro %}
