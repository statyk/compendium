<!doctype html>
{% set _theme = default_theme() %}
<html lang="en"{% if _theme != "auto" %} data-theme="{{ _theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Self-Checkout — {{ library_name() }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/ui/static/favicon.svg">
  <script nonce="{{ csp_nonce(request) }}">
    try {
      var t = localStorage.getItem('compendium_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      else if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="/ui/static/pico.min.css">
  <link rel="stylesheet" href="/ui/static/compendium.css">
  <script src="/ui/static/htmx.min.js" nonce="{{ csp_nonce(request) }}" defer></script>
</head>
<body class="kiosk-page">
  <main class="kiosk-shell">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
