{% extends "base.html" %}
{% block title %}Change Password — Compendium{% endblock %}
{% block content %}
<h2>Change Password</h2>
<p>You'll be logged out after a successful change. Log back in with your new password.</p>

{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}

<form method="post" action="/ui/me/password" style="max-width: 30rem">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="current_password">Current password
    <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
  </label>

  <label for="new_password">New password
    <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
  </label>

  <label for="confirm_password">Confirm new password
    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
  </label>

  <button type="submit">Change password</button>
</form>
{% endblock %}
