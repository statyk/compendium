{% extends "base.html" %}
{% block title %}Patron cards — Compendium{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
  <ul><li><a href="/ui/labels">Labels</a></li><li>Patron cards</li></ul>
</nav>
<h2>Patron cards</h2>

{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}

<form method="post" action="/ui/labels/patrons">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label>Template
    <select name="template">
      {% for t in templates %}
      <option value="{{ t.key }}"{% if t.key == "avery-5871" %} selected{% endif %}>{{ t.display }}</option>
      {% endfor %}
    </select>
  </label>

  <label>Format
    <select name="format">
      <option value="full">Full card (library name + patron info + barcode)</option>
      <option value="sticker">Sticker (barcode + card number only, affix to pre-made card)</option>
    </select>
  </label>

  <details>
    <summary>Filter which patrons to print</summary>
    <label>Category
      <select name="category">
        <option value="">All categories</option>
        {% for c in categories %}<option value="{{ c.code }}">{{ c.display_name }}</option>{% endfor %}
      </select>
    </label>
    <label>
      <input type="checkbox" name="active_only">
      Active patrons only
    </label>
    <label>Or, exact card numbers <small>(comma-separated — overrides other filters)</small>
      <textarea name="cards" rows="3" placeholder="00000001, 00000002, ..."></textarea>
    </label>
  </details>

  <label>Start at label # <small>(skip this many positions on the first sheet)</small>
    <input type="number" name="start_label" min="0" value="0" style="max-width:6rem">
  </label>

  <button type="submit">Generate PDF</button>
</form>
{% endblock %}
