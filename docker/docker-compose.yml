services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: compendium
      POSTGRES_USER: compendium
      # --- Option A (quick-start / dev): plain env var from .env ---
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # --- Option B (production): Docker secret ---
      # POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # secrets:
    #   - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compendium -d compendium"]
      interval: 5s
      timeout: 5s
      retries: 10

  compendium:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: compendium:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Env-only settings (must live in env; not editable from the UI).
      #
      # --- Option A (quick-start / dev): plain env vars from .env ---
      COMPENDIUM_DATABASE_URL: postgresql+psycopg://compendium:${POSTGRES_PASSWORD}@db:5432/compendium
      COMPENDIUM_JWT_SECRET_KEY: ${COMPENDIUM_JWT_SECRET_KEY:?COMPENDIUM_JWT_SECRET_KEY must be set in .env}
      #
      # --- Option B (production): Docker secrets ---
      # Use *_FILE variants instead of the plain env vars above. Compendium
      # reads the file and uses its contents as the setting value; the plain env
      # var always wins if both are set.
      # Comment out the Option-A lines above and uncomment these:
      # POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password   # handled by entrypoint.sh
      # COMPENDIUM_JWT_SECRET_KEY_FILE: /run/secrets/compendium_jwt
      # COMPENDIUM_SECRET_KEY_FILE: /run/secrets/compendium_secret_key
      # COMPENDIUM_SMTP_PASSWORD_FILE: /run/secrets/compendium_smtp_password
      #
      COMPENDIUM_JWT_EXPIRE_MINUTES: ${COMPENDIUM_JWT_EXPIRE_MINUTES:-480}
      # nginx terminates TLS in front of Compendium — issue cookies with the
      # Secure flag so they only travel over HTTPS.
      COMPENDIUM_SECURE_COOKIES: "true"
      # Optional secrets — leave empty in .env to skip (or use *_FILE variants above).
      COMPENDIUM_TMDB_API_KEY: ${COMPENDIUM_TMDB_API_KEY:-}
      COMPENDIUM_SMTP_PASSWORD: ${COMPENDIUM_SMTP_PASSWORD:-}
      COMPENDIUM_GOOGLE_BOOKS_API_KEY: ${COMPENDIUM_GOOGLE_BOOKS_API_KEY:-}
      # Encryption key for DB-stored secrets (Admin → System → Secrets).
      COMPENDIUM_SECRET_KEY: ${COMPENDIUM_SECRET_KEY:-}
      # Optional overrides — usually configured at /ui/admin/settings instead.
      COMPENDIUM_BOOK_METADATA_SOURCE_PREFERENCE: ${COMPENDIUM_BOOK_METADATA_SOURCE_PREFERENCE:-}
      COMPENDIUM_BOOK_METADATA_FALLBACK_ENABLED: ${COMPENDIUM_BOOK_METADATA_FALLBACK_ENABLED:-}
      COMPENDIUM_METADATA_CACHE_TTL_DAYS: ${COMPENDIUM_METADATA_CACHE_TTL_DAYS:-}
      COMPENDIUM_MAX_UPLOAD_BYTES: ${COMPENDIUM_MAX_UPLOAD_BYTES:-}
      # Dev-only escape hatch — leave unset in production.
      COMPENDIUM_ALLOW_INSECURE_JWT: ${COMPENDIUM_ALLOW_INSECURE_JWT:-}
      # First-run admin bootstrap (only used if the username doesn't exist yet).
      COMPENDIUM_ADMIN_USERNAME: ${COMPENDIUM_ADMIN_USERNAME:-admin}
      COMPENDIUM_ADMIN_PASSWORD: ${COMPENDIUM_ADMIN_PASSWORD:-}
      COMPENDIUM_ADMIN_ROLE: ${COMPENDIUM_ADMIN_ROLE:-Administrator}
      # Library name, theme, fines, holds, SMTP host/port/from, retention,
      # etc. are configured at /ui/admin/settings (or via `compendium settings`)
      # after first login — env vars override but normally aren't set here.
    # secrets:
    #   - postgres_password    # only if using Option B above
    #   - compendium_jwt
    #   - compendium_secret_key
    #   - compendium_smtp_password
    volumes:
      - cover_cache:/var/cache/compendium/covers
      - ./backups:/var/backups/compendium
    # No ports published — nginx is the only external-facing service.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/ui/login\", timeout=3).status==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      compendium:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      COMPENDIUM_CERT_CN: ${COMPENDIUM_CERT_CN:-compendium.local}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/99-compendium-cert.sh:ro
      - ./certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/docker-entrypoint.d/99-compendium-cert.sh"]

volumes:
  db_data:
  cover_cache:

# --- Docker secrets (Option B — production) ----------------------------------
# Uncomment and create the secret files before running `docker compose up`.
# Each file should contain only the secret value (one line, no trailing newline).
# Example: printf 'my-strong-password' > secrets/postgres_password
#
# secrets:
#   postgres_password:
#     file: ./secrets/postgres_password
#   compendium_jwt:
#     file: ./secrets/compendium_jwt
#   compendium_secret_key:
#     file: ./secrets/compendium_secret_key
#   compendium_smtp_password:
#     file: ./secrets/compendium_smtp_password
